<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
<style>
    td,
    th {
        border: 1px solid green;
        padding: 10px;
    }

    th {
        background-color: rgb(52, 235, 208);
        color: white;
        border: 1px solid rgb(239, 55, 211)
    }

    tfoot td {
        text-align: center;
    }

    table {
        border-collapse: collapse;
        font-family:Georgia, 'Times New Roman', Times, serif;
    }

    tbody>tr {
        cursor: pointer;
    }

    tbody>tr:hover {
        background-color: #c88585;
        color: rgb(227, 227, 227);
    }

    tfoot td {
        text-align: center;
    }

    tr:nth-child(odd) {
        background-color: #e7e7e7;
        color: #fff;
        text-shadow: 2px 2px 3px rgb(74, 195, 240), -2px -2px 5px blueviolet;
    }
</style>
</head>

<body>
   
<table>
    <caption>Tabel Mahasiswa</caption>
    <thead>
        <tr>
            <th rowspan="2">NO</th>
            <th rowspan="2">NIM</th>
            <TH colspan="3">Mahasiswa</TH>
        <tr>
            <th>Nama</th>
            <th>Prodi</th>
            <th>Alamat</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td>2402011011</td>
            <td>Fratiwi Eky Wahyuni</td>
            <td>Teknik Informatika</td>
            <td>Jakarta</td>
        </tr>
        <tr>
            <td>2</td>
            <td>2402011012</td>
            <td>Gita Angriany</td>
            <td>Teknik Informatika</td>
            <td>Bungo</td>
            
        </tr>
        <tr>
            <td>3</td>
            <td>2402011042</td>
            <td>Nurlaili</td>
            <td>Teknik Informatika</td>
            <td>Bungo</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4">jumlah</td>
            <td>3</td>
        </tr>
    </tfoot>
</table>
</body>


</html>
